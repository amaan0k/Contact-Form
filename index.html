<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            font-family: calibri;
            background-color: #f4f7fb;

            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;

        }
    </style>

     <style>
        .entireform{ width: 650px;

        }
     </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact-Form</title>
</head>
<body>

    <div class="entireform">

    <h1 style="font-family: calibri; font-size: 40px; text-align: center;" >Contact-Form</h1>
    <hr style="margin-top: 100px;">
 
    <style>
        h1{
            position: relative;
          top: 45px;
        }
    </style>
     
     <style>
        hr{
            border: none;
            border-top: 1px solid rgb(224, 221, 221);
        }
     </style>
     
    <div class="client-section">

    <p class="client-label">Client Name</p>
    <style>
        .client-label{
            text-align: left;
            margin-top: 40px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
   
    <div class="name-box">
        <input type="text">
        <p>First Name</p>
         </div>

         <div class="name-box">
            <input type="text">
            <p>Middle Name</p>
         </div>

         <div class="name-box">
            <input type="text">
            <p>Last Name</p>

         </div>

         </div>

<style>
    .client-section{
        text-align: left;
        width: 500px;
        margin: auto;
        
    }
</style>

 <style>
    .name-box{
        display: inline-block;
        margin-top: 3px;
        
    }

    .name-box input{
        width: 150px;
        height: 32px;
        border: 1px solid rgb(218, 218, 218);
        border-radius: 10px;
        transition: box-shadow 0.2s;

    }

    .name-box input:hover{
        box-shadow: 0 0 5px rgb(112, 201, 246);
    }

 </style>
 
    
      <div class="phonemail">
     
    <div class="name-box1">
        <p style="font-size: 18px; font-weight: bold;">Phone Number</p>
        <input type="text">
        <p style="width: 220px;">Please enter a valid phone number.</p>
    </div>

    <div class="name-box1">
        <p style="font-size: 18px; font-weight: bold;">E-mail</p>
        <input type="text">
        <p>example@example.com</p>

    </div>

</div>

    <style>
        .name-box1{
            display: inline-block;
            width: 220px;
            margin-top: 10px;
            margin-right: 25px;
            vertical-align: top;

        }

        .name-box1 input{
            width: 220px;
            height: 35px;
            border: 1px solid rgb(218, 218, 218); 
            border-radius: 10px;
            transition: box-shadow 0.2s;
        }

        .name-box1 input:hover{
        box-shadow: 0 0 5px rgb(112, 201, 246);

        }

       
    </style>

   <style>
    .phonemail{
        width: 500px;
        margin: auto;
        border: none;
        text-align: left;
    }
   </style>


 <div class="adress-box">
    <p style="font-size: 18px; font-weight: bold;">Address</p>
    <input type="text">
    <p>street Address</p>
    <input type="text">
    <p>Street Address Line 2</p>

 </div>

 <style>
    .adress-box input{
        width: 470px;
        height: 35px;
        border: 1px solid rgb(218, 218, 218); 
        border-radius: 10px;
        transition: box-shadow 0.2s;
                       
    }

    .adress-box{
        margin: auto;
        width: 500px;
        border: none;
        text-align: left;
        
    }

    .adress-box input:hover{
        box-shadow: 0 0 5px rgb(112, 201, 246);

        }
 </style>

<div class="phonemail">
<div class="name-box1">
    <input type="text">
    <p>City</p>
    
</div>

<div class="name-box1">
    <input type="text">
    <p>State/Province</p>
</div>
</div>


<div class="adress-box">
    <input type="text">
    <p>Postal/Zip Code</p>
</div>
<br>

<div class="commentbox"> 
<p style="font-size: 18px; font-weight: bold;">Comment</p>
<textarea rows="10" cols="65" style="border-radius: 10px; border: 1px solid rgb(218, 218, 218); ;"></textarea>
</div>

<style>
    .commentbox textarea:hover{
        box-shadow: 0 0 5px rgb(112, 201, 246);

    }
</style>


<br>
<br>
<br>


<button class="submitbtn" type="submit" style="font-weight: bold;">Submit</button>
   

    <style>
        .submitbtn{
            width: 150px;
            height: 40px;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            background: linear-gradient(90deg, #2395ff , #002852
            );
            background-size: 150% 100%;
            background-position: left;
            transition: background-position 0.1s ease ;
        }

        .submitbtn:hover{
            background-position: right;
        }
    </style>

    </div>

    <style>
        .entireform{
            width: 650px;
            margin: auto;
            margin-right: auto;
            border: none;
            text-align: center;
            
        }
